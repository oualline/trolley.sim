     width="680"
     height="620"
     fill="#ffffff"
     id="rect6"
     x="0"
     y="0" />
  <!-- Outer touchpad body -->
  <rect
     x="140"
     y="40"
     width="400"
     height="480"
     rx="26"
     fill="#1c1c1c"
     stroke="#000000"
     stroke-width="1"
     id="rect8" />
  <!-- Sensing surface -->
  <rect
     x="168"
     y="66"
     width="344"
     height="330"
     rx="10"
     fill="#0a0a0a"
     stroke="#333333"
     stroke-width="1"
     id="rect10" />
  <!-- Buttons -->
