  <title
     id="title2">Touchpad diagram with a finger on the trackpad surface and a second finger pressing the left button</title>
  <desc
     id="desc4">Illustration of a laptop touchpad: a rounded rectangular body containing a large flat sensing surface and three buttons below (left, middle, right). One finger rests on the sensing surface performing a pointing gesture, and a second finger reaches up from below the touchpad to press the left button.</desc>
